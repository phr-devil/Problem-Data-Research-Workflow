name: PD-RW offline contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q core evals tests  # fail fast on syntax errors
      - run: python -m json.tool contracts/human_review_protocol.v1.json > /dev/null
      - run: python -m json.tool contracts/research_activity_protocol.v1.json > /dev/null
      - run: python -m unittest discover -s tests -p 'test_author_strategy_review.py' -v  # joined H6/H8 handoff checks
      - run: python -m evals.benchmark validate  # synthetic cases only; no model, web, data or image output
      - run: python -m py_compile chapter10_replay.py
      - run: python -m json.tool SCENARIOS.json > /dev/null
      - run: python -m unittest discover -s tests -p 'test_manuscript_qa*.py' -v  # offline QA tests
      - run: python -m unittest discover -s tests -p 'test_manuscript_claim_guard.py' -v  # offline semantic/provenance alert behavior
      - run: python -m unittest discover -s tests -p 'test_literature.py' -v  # preserve metadata search behavior
      - run: python -m unittest discover -s tests -p 'test_research_claim_writing_contracts.py' -v  # offline science-to-paper policy regression
      - run: python -m unittest discover -s tests -p 'test_positive_science_value_contracts.py' -v  # offline value/evidence/claims checks
      - run: python -m unittest discover -s tests -p 'test_execution_preflight.py' -v  # event preflight regression
      - run: python -m unittest discover -s tests -v  # full offline suite; no real Agent, download or training
