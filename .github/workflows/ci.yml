name: PD-RW offline contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # First fail on invalid Python or machine-readable contracts.
      - run: python -m compileall -q core evals tests
      - run: python -m py_compile chapter10_replay.py
      - run: python -m json.tool contracts/human_review_protocol.v1.json > /dev/null
      - run: python -m json.tool contracts/research_activity_protocol.v1.json > /dev/null
      - run: python -m json.tool SCENARIOS.json > /dev/null
      # One complete deterministic suite; do not repeat test subsets.
      - run: python -m unittest discover -s tests -v
      - run: python -m evals.benchmark validate
