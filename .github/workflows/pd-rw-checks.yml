name: PD-RW structural and evidence checks

on:
  push:
    branches: [main, feat/v1.4-evidence-first-workflow]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline structural and behavioral tests
        run: python -m unittest discover -s tests -v
